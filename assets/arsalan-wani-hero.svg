<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Arsalan Wani — Data Analyst and Data Science Student">
  <defs>
    <linearGradient id="ah-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.45" stop-color="#190B12"/>
      <stop offset="0.75" stop-color="#451126"/>
      <stop offset="1" stop-color="#701A3D"/>
      <animate attributeName="x2" values="1;0.85;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ah-glow" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ah-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="ah-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F8F0F3" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#ah-bg)"/>
  <rect width="1200" height="360" fill="url(#ah-grid)"/>
  <ellipse cx="940" cy="60" rx="320" ry="180" fill="url(#ah-glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Abstract data motif: rising chart line with nodes -->
  <g fill="none" stroke="#C77B9B" stroke-width="2" stroke-opacity="0.9">
    <path d="M 60 300 L 220 260 L 380 278 L 540 210 L 700 228 L 860 150 L 1020 120 L 1140 84" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="320" to="0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#190B12" stroke="#E5B5C7" stroke-width="2">
    <circle cx="60" cy="300" r="5"/>
    <circle cx="220" cy="260" r="5"/>
    <circle cx="380" cy="278" r="5"/>
    <circle cx="540" cy="210" r="5"/>
    <circle cx="700" cy="228" r="5"/>
    <circle cx="860" cy="150" r="5"/>
    <circle cx="1020" cy="120" r="5"/>
    <circle cx="1140" cy="84" r="5"/>
  </g>

  <!-- Subtle ascending bars, lower right -->
  <g fill="#C77B9B" opacity="0.22">
    <rect x="980" y="296" width="18" height="24"/>
    <rect x="1006" y="282" width="18" height="38"/>
    <rect x="1032" y="264" width="18" height="56"/>
    <rect x="1058" y="244" width="18" height="76"/>
  </g>

  <!-- Coordinate marks -->
  <g stroke="#F8F0F3" stroke-opacity="0.25" stroke-width="1">
    <path d="M 60 330 L 60 322 M 52 326 L 68 326"/>
    <path d="M 1140 330 L 1140 322 M 1132 326 L 1148 326"/>
  </g>

  <!-- Identity -->
  <text x="60" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="6" fill="#F8F0F3">ARSALAN WANI</text>
  <rect x="62" y="170" width="180" height="3" fill="url(#ah-line)">
    <animate attributeName="opacity" values="1;0.55;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="62" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4" fill="#E5B5C7">DATA ANALYST <tspan fill="#C77B9B">|</tspan> DATA SCIENCE STUDENT</text>
  <text x="62" y="250" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#F8F0F3" opacity="0.75">Turning raw data into meaningful insights</text>
</svg>
