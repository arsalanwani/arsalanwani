<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Arsalan Wani — Data Analytics">
  <defs>
    <linearGradient id="af-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="af-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="90" fill="url(#af-bg)"/>

  <!-- Subtle moving data line -->
  <g fill="none" stroke="url(#af-line)" stroke-width="2" stroke-opacity="0.85">
    <path d="M 0 45 L 1200 45" stroke-dasharray="4 14">
      <animate attributeName="stroke-dashoffset" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#190B12" stroke="#E5B5C7" stroke-width="1.5">
    <circle cx="300" cy="45" r="4"/>
    <circle cx="600" cy="45" r="4"/>
    <circle cx="900" cy="45" r="4"/>
  </g>

  <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="5" fill="#E5B5C7" opacity="0.8">DATA ANALYST &#183; DATA SCIENCE STUDENT</text>
</svg>
